<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reconciliation Autopilot{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rzp-navy: #0C2651;
            --rzp-navy-light: #163a6e;
            --rzp-blue: #0D94FB;
            --rzp-blue-dark: #0b7fd6;
            --rzp-blue-light: #EAF6FF;
            --rzp-bg: #F3F6FB;
            --rzp-text: #1A2B4A;
            --rzp-muted: #6B7A99;
            --rzp-border: #E3E8F0;
            --rzp-green: #16a34a;
            --rzp-green-light: #eafaf1;
            --rzp-red: #dc2626;
            --rzp-red-light: #fdecea;
            --rzp-purple: #8e44ad;
            --rzp-purple-light: #faf5fc;
            --rzp-amber: #b8860b;
            --rzp-amber-light: #fff3cd;
            --shadow-sm: 0 1px 3px rgba(12,38,81,0.07);
            --shadow-md: 0 8px 24px rgba(12,38,81,0.10);
            --shadow-lg: 0 20px 60px rgba(12,38,81,0.28);
            --radius-md: 14px;
            --radius-lg: 20px;
            --ease: cubic-bezier(.4,0,.2,1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(900px 500px at 12% -10%, rgba(13,148,251,0.10), transparent 60%),
                radial-gradient(700px 400px at 110% 10%, rgba(142,68,173,0.08), transparent 55%),
                var(--rzp-bg);
            background-attachment: fixed;
            margin: 0;
            padding: 0 0 60px 0;
            color: var(--rzp-text);
            -webkit-font-smoothing: antialiased;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.92); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseDot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.55); }
            70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
        }
        @keyframes slideInRight {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes checkPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* ---------- Topbar ---------- */
        .topbar {
            background: linear-gradient(120deg, var(--rzp-navy) 0%, #123566 60%, var(--rzp-navy-light) 100%);
            padding: 20px 24px;
            margin-bottom: 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(12,38,81,0.25);
        }
        .topbar-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--rzp-blue), #4fc3f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(13,148,251,0.45);
            flex-shrink: 0;
        }
        .brand-icon svg { width: 20px; height: 20px; }
        .topbar-inner h1 {
            margin: 0;
            font-size: 1.28em;
            color: white;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .topbar-inner .badge-live {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 0.68em;
            font-weight: 700;
            padding: 6px 12px 6px 10px;
            border-radius: 20px;
            letter-spacing: 0.6px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            backdrop-filter: blur(6px);
        }
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulseDot 1.8s infinite;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .container.container-wide { max-width: 1320px; }

        /* ---------- Dashboard grid (sidebar + results) ---------- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            align-items: start;
        }
        .sidebar-col { display: flex; flex-direction: column; min-width: 0; }
        .main-col { display: flex; flex-direction: column; min-width: 0; }
        .main-col .summary { justify-content: flex-start; }
        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* ---------- Cards ---------- */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--rzp-border);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 20px;
            animation: fadeInUp .5s var(--ease) both;
            transition: box-shadow .25s var(--ease), transform .25s var(--ease);
        }
        .card:hover {
            box-shadow: var(--shadow-md);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.08em;
            color: var(--rzp-navy);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        .card h2 .icon-badge {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .card h2 .icon-badge svg { width: 16px; height: 16px; }

        .matched-section { border-left: 4px solid var(--rzp-green); }
        .flags-section { border-left: 4px solid var(--rzp-red); }

        /* ---------- Flags ---------- */
        .flag-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--rzp-border);
            transition: opacity .35s var(--ease), transform .35s var(--ease), background-color .35s var(--ease), border-color .35s var(--ease);
            animation: fadeInUp .45s var(--ease) both;
        }
        .flag-item:last-child { border-bottom: none; }
        .flag-type {
            font-weight: 700;
            color: #c0392b;
            text-transform: uppercase;
            font-size: 0.83em;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .flag-item.fuzzy-match {
            border-left: 4px solid var(--rzp-purple);
            background: var(--rzp-purple-light);
            padding: 14px 14px 14px 16px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .flag-item.fuzzy-match .flag-type { color: var(--rzp-purple); }
        .confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 4px;
            padding: 3px 10px;
            background: linear-gradient(135deg, var(--rzp-purple), #b76bd6);
            color: white;
            border-radius: 20px;
            font-size: 0.78em;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(142,68,173,0.35);
        }
        .matched-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid var(--rzp-border);
            font-size: 0.95em;
            border-radius: 8px;
            transition: background .2s var(--ease);
            animation: fadeInUp .4s var(--ease) both;
        }
        .matched-item:hover { background: #f7fafd; }
        .matched-item:last-child { border-bottom: none; }
        .matched-item .check-icon {
            display: inline-flex;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--rzp-green-light);
            color: var(--rzp-green);
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .matched-item .check-icon svg { width: 11px; height: 11px; }
        .matched-amount {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--rzp-navy);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95em;
        }

        .ai-text {
            background: linear-gradient(135deg, var(--rzp-blue-light), #f2fbff);
            padding: 14px 16px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.92em;
            border: 1px solid rgba(13,148,251,0.12);
        }
        .ai-text p { margin: 0 0 6px 0; line-height: 1.5; }
        .ai-text p:last-child { margin-bottom: 0; }
        .action { color: var(--rzp-blue-dark); font-weight: 600; }

        /* ---------- Summary ---------- */
        .summary {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .summary-box {
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--rzp-border);
            box-shadow: var(--shadow-sm);
            padding: 16px 28px;
            text-align: center;
            min-width: 100px;
            animation: popIn .45s var(--ease) both;
            transition: transform .25s var(--ease), box-shadow .25s var(--ease);
        }
        .summary-box:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .number {
            font-size: 2em;
            font-weight: 800;
            color: var(--rzp-navy);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        .label {
            color: var(--rzp-muted);
            text-transform: uppercase;
            font-size: 0.7em;
            font-weight: 600;
            letter-spacing: 0.6px;
            margin-top: 3px;
        }

        /* ---------- Connect Razorpay Account ---------- */
        .connect-form { display: flex; flex-direction: column; gap: 14px; }
        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 0.82em; font-weight: 600; color: var(--rzp-muted); }
        .field-with-toggle { position: relative; }
        .field-with-toggle input {
            width: 100%;
            padding: 11px 42px 11px 14px;
            border: 1px solid var(--rzp-border);
            border-radius: 9px;
            font-size: 0.92em;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
        }
        .field-with-toggle input:focus {
            outline: none;
            border-color: var(--rzp-blue);
            box-shadow: 0 0 0 3px rgba(13,148,251,0.15);
        }
        .field-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--rzp-muted);
            padding: 6px;
            display: flex;
            border-radius: 6px;
        }
        .field-toggle:hover { background: var(--rzp-bg); color: var(--rzp-text); }
        .field-toggle svg { width: 16px; height: 16px; }

        .connected-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--rzp-green-light);
            border: 1px solid rgba(22,163,74,0.25);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            animation: popIn .4s var(--ease);
            flex-wrap: wrap;
        }
        .connected-panel .connected-info { display: flex; align-items: center; gap: 12px; }
        .connected-panel .check-circle {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--rzp-green);
            color: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            animation: checkPop .4s var(--ease);
        }
        .connected-panel .check-circle svg { width: 18px; height: 18px; }
        .connected-panel .connected-title { font-weight: 700; color: #1e7e34; font-size: 0.95em; }
        .connected-panel .connected-key { color: var(--rzp-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.85em; margin-top: 2px; }

        .not-connected-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--rzp-blue-light);
            border: 1px solid rgba(13,148,251,0.2);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            flex-wrap: wrap;
        }
        .not-connected-panel p { margin: 0; color: var(--rzp-navy); font-size: 0.92em; }

        /* ---------- Upload / Dropzone ---------- */
        .upload-form { display: flex; flex-direction: column; gap: 16px; }
        .dropzone {
            border: 2px dashed var(--rzp-border);
            border-radius: var(--radius-md);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
            background: #fafcff;
        }
        .dropzone:hover { border-color: var(--rzp-blue); background: var(--rzp-blue-light); }
        .dropzone.drag-over {
            border-color: var(--rzp-blue);
            background: var(--rzp-blue-light);
            transform: scale(1.01);
        }
        .dropzone.has-file {
            border-color: var(--rzp-green);
            background: var(--rzp-green-light);
        }
        .dropzone-content { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .dropzone-content svg { width: 30px; height: 30px; color: var(--rzp-blue); }
        .dropzone.has-file .dropzone-content svg { color: var(--rzp-green); }
        .dropzone-content p { margin: 0; }
        .dz-title { font-weight: 600; color: var(--rzp-text); font-size: 0.96em; }
        .dz-filename { color: var(--rzp-muted); font-size: 0.82em; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.9em;
            color: var(--rzp-muted);
            cursor: pointer;
        }
        .checkbox-row input { accent-color: var(--rzp-blue); width: 15px; height: 15px; cursor: pointer; }

        /* ---------- Buttons ---------- */
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 700;
            font-family: inherit;
            transition: transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), opacity .2s var(--ease);
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-primary, .upload-form button[type=submit] {
            background: linear-gradient(135deg, var(--rzp-blue), #0b86e6);
            color: white;
            box-shadow: 0 4px 14px rgba(13,148,251,0.35);
        }
        .btn-primary:hover:not(:disabled), .upload-form button[type=submit]:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(13,148,251,0.5);
            transform: translateY(-1px);
        }
        .btn-block { width: 100%; padding: 12px; font-size: 0.95em; }

        .btn-confirm { background: var(--rzp-navy); color: white; }
        .btn-confirm:hover:not(:disabled) { background: var(--rzp-navy-light); transform: translateY(-1px); }
        .btn-dismiss { background: #eef1f6; color: var(--rzp-muted); }
        .btn-dismiss:hover:not(:disabled) { background: #dfe4ec; }
        .btn-undo { background: var(--rzp-amber-light); color: var(--rzp-amber); }
        .btn-undo:hover:not(:disabled) { background: #ffe9a8; }

        .btn-demo {
            background: linear-gradient(135deg, var(--rzp-purple), #a35bc4);
            color: white;
            box-shadow: 0 4px 14px rgba(142,68,173,0.35);
        }
        .btn-demo:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(142,68,173,0.5); transform: translateY(-1px); }

        .btn-link {
            background: none;
            padding: 2px 4px;
            color: var(--rzp-blue);
            text-decoration: underline;
            font-size: 0.95em;
            font-weight: 600;
        }
        .btn-link:hover:not(:disabled) { color: var(--rzp-blue-dark); }

        .btn-spinner {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            animation: spin .7s linear infinite;
            display: none;
        }
        .btn.is-loading .btn-spinner { display: inline-block; }
        .btn.is-loading .btn-label { opacity: 0.85; }

        .note { color: var(--rzp-muted); font-size: 0.88em; margin-top: 10px; line-height: 1.5; }

        /* ---------- Flag status ---------- */
        .flag-item.status-confirmed {
            opacity: 0.65;
            border-left: 3px solid var(--rzp-green);
            padding-left: 12px;
        }
        .flag-item.status-dismissed {
            opacity: 0.5;
            border-left: 3px solid #95a5a6;
            padding-left: 12px;
        }
        .flag-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
        .status-badge {
            font-size: 0.72em;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background .3s var(--ease), color .3s var(--ease);
        }
        .status-badge.pending { background: var(--rzp-amber-light); color: var(--rzp-amber); }
        .status-badge.confirmed { background: var(--rzp-green-light); color: #1e7e34; }
        .status-badge.dismissed { background: #e9ecef; color: #6c757d; }

        /* ---------- Result alerts ---------- */
        .result-alert {
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.92em;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeInUp .35s var(--ease) both;
        }
        .result-alert svg { width: 18px; height: 18px; flex-shrink: 0; }
        .result-alert.success { background: var(--rzp-green-light); color: #1e7e46; }
        .result-alert.error { background: var(--rzp-red-light); color: #c0392b; }

        /* ---------- Empty state ---------- */
        .empty-state {
            text-align: center;
            padding: 56px 20px;
        }
        .empty-state svg { width: 64px; height: 64px; color: var(--rzp-border); margin-bottom: 14px; }
        .empty-state p { color: var(--rzp-muted); margin: 0; font-size: 0.98em; }

        /* ---------- Hero (landing page) ---------- */
        .hero-card { text-align: center; padding: 56px 32px; }
        .hero-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            margin: 0 auto 22px;
            background: linear-gradient(135deg, var(--rzp-blue), #4fc3f7);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(13,148,251,0.4);
            animation: popIn .5s var(--ease);
        }
        .hero-icon svg { width: 32px; height: 32px; }
        .hero-card h2 { display: block; font-size: 1.6em; color: var(--rzp-navy); margin: 0 0 12px; font-weight: 800; letter-spacing: -0.01em; }
        .hero-card .note { max-width: 480px; margin: 0 auto 30px; font-size: 0.98em; }
        .hero-cta { max-width: 340px; margin: 0 auto; }
        .hero-secondary { margin-top: 22px; font-size: 0.9em; }
        .hero-secondary a { color: var(--rzp-muted); font-weight: 600; }
        .hero-features {
            display: flex; justify-content: center; gap: 28px; margin-top: 36px; flex-wrap: wrap;
        }
        .hero-feature { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 140px; }
        .hero-feature .icon-badge { width: 40px; height: 40px; border-radius: 12px; display:flex; align-items:center; justify-content:center; }
        .hero-feature .icon-badge svg { width: 20px; height: 20px; }
        .hero-feature span.f-label { font-size: 0.8em; color: var(--rzp-muted); font-weight: 600; }

        /* ---------- Loading overlay ---------- */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 25, 51, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s var(--ease);
        }
        .loading-overlay.active { opacity: 1; pointer-events: all; }
        .loading-box {
            background: white;
            padding: 40px 52px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: popIn .35s var(--ease);
            max-width: 320px;
        }
        .spinner-ring {
            width: 54px; height: 54px;
            border-radius: 50%;
            border: 4px solid rgba(13,148,251,0.15);
            border-top-color: var(--rzp-blue);
            border-right-color: var(--rzp-blue);
            animation: spin .85s linear infinite;
        }
        .loading-box p { margin: 0; }
        #loadingText { font-weight: 700; color: var(--rzp-navy); font-size: 1.02em; }
        .loading-sub { color: var(--rzp-muted); font-size: 0.85em; }

        /* ---------- Toasts ---------- */
        .toast-container {
            position: fixed;
            bottom: 22px;
            right: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;
        }
        .toast {
            background: white;
            border-radius: 10px;
            padding: 13px 18px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--rzp-blue);
            font-size: 0.88em;
            min-width: 240px;
            max-width: 320px;
            animation: slideInRight .3s var(--ease);
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--rzp-text);
        }
        .toast.success { border-left-color: var(--rzp-green); }
        .toast.error { border-left-color: var(--rzp-red); }
        .toast.leaving { animation: slideInRight .25s var(--ease) reverse forwards; }
        .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        .toast.success svg { color: var(--rzp-green); }
        .toast.error svg { color: var(--rzp-red); }
        .toast.info svg { color: var(--rzp-blue); }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 12.5H11L10 22L19.5 10.5H13L14 2Z"/></svg>
                </span>
                <h1>Reconciliation Autopilot</h1>
            </a>
            <span class="badge-live"><span class="live-dot"></span>RAZORPAY BUILDATHON</span>
        </div>
    </div>
    <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-ring"></div>
            <p id="loadingText">Working on it</p>
            <p class="loading-sub" id="loadingSubtext">This will just take a moment…</p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const ICONS = {
            success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
            error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
            info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
        };

        function showToast(message, type) {
            type = type || 'info';
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `${ICONS[type] || ICONS.info}<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('leaving');
                setTimeout(() => toast.remove(), 260);
            }, 3200);
        }

        function showLoadingOverlay(text, subtext) {
            const overlay = document.getElementById('loadingOverlay');
            if (text) document.getElementById('loadingText').textContent = text;
            if (subtext) document.getElementById('loadingSubtext').textContent = subtext;
            overlay.classList.add('active');
        }

        function setButtonLoading(btn, isLoading) {
            if (!btn) return;
            btn.disabled = isLoading;
            btn.classList.toggle('is-loading', isLoading);
        }

        function animateCounters() {
            document.querySelectorAll('.number[data-target]').forEach(el => {
                const target = parseInt(el.getAttribute('data-target'), 10) || 0;
                const duration = 700;
                const start = performance.now();
                function tick(now) {
                    const progress = Math.min((now - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(eased * target);
                    if (progress < 1) requestAnimationFrame(tick);
                    else el.textContent = target;
                }
                requestAnimationFrame(tick);
            });
        }
        document.addEventListener('DOMContentLoaded', animateCounters);
    </script>
    {% block extra_script %}{% endblock %}
</body>
</html>
